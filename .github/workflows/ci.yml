name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node 24 on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node install.js
        working-directory: node_modules/tree-sitter-cli
      - run: npm run build
      - run: npm run lint
      - run: npm test
      - run: npm run install
      - run: npm ci --ignore-scripts
        working-directory: test-npm-package
      - run: npm test
        working-directory: test-npm-package
      - run: npm pack --dry-run
